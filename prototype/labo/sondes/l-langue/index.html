<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sonde L</title>
<!-- Politique de l'app sonde L : celle de Publipostage+ (script-src 'self', frame-src 'none', form-action 'none', pas de default-src). -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
</head>
<body>
<h1>Sonde L : une app qui suit la langue de GFS</h1>
<p>Ce que la sonde a reçu est écrit dans <code>body[data-sonde]</code>, que le labo lit : la langue de l'adresse de son cadre, celles que rendent ses appels <code>contexte</code> et les événements <code>langue</code>.</p>
<script src="langue.js"></script>
</body>
</html>
