<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sonde N</title>
<!-- Politique de l'app sonde N : celle d'une app hébergée (rien d'en ligne, rien d'extérieur ; `style-src 'self'` : l'ambiance se pose par le CSSOM, jamais par un style écrit d'après un message). Le kit est servi par le labo sous /kit/, même origine que la page. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="/kit/css/tokens.css">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main>
  <h1>Sonde N : l'ambiance par le kit</h1>
  <p class="muted">Une app écrite avec le kit commun : elle démarre <code>Ambiance.start()</code>, ses feuilles lisent les jetons de la charte.</p>
  <section class="card">
    <p>Un texte sur la carte, et <a class="link" href="#sonde">un lien</a>.</p>
    <button type="button" class="solid">Un bouton plein</button>
    <button type="button" class="soft">Un bouton doux</button>
    <input class="field" aria-label="Une saisie" value="Une saisie">
  </section>
</main>
</body>
</html>
