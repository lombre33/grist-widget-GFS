<!-- Politique de sécurité du contenu de GFS. Chaque ligne a son motif :
     script-src : le code de GFS ('self'), la carte d'importation en ligne (par son empreinte, voir plus bas), le script d'API de Grist (adresse entière) ; 'unsafe-eval' faute de mieux, le fichier que Grist sert est un bundle de développement qui s'évalue par eval() (même raison que dans les apps) ;
     frame-src 'self' blob: : les apps tournent dans des sous-cadres du site de GFS, jamais d'une autre adresse ; blob: pour une seule raison : Firefox applique cette ligne à l'enregistrement d'un fichier que l'app fabrique (export Word, PowerPoint), là où Chromium ne la regarde pas (faits vérifiés 11) ;
     frame-src, deux adresses de plus (carte du porteur du 07/11, « Politique élargie ») : https://www.youtube-nocookie.com et https://player.vimeo.com, pour une seule raison : le lecteur de vidéos que GFS pose pour une app qui l'a déclaré (`permissions.lecteurs`, contrats 3.4 point 7). Une vidéo ne se charge qu'au clic de la personne sur le bouton de lecture de l'app, jamais avant ; sans cette déclaration, GFS ne pose aucun lecteur ;
     connect-src 'self' : GFS ne lit que ses propres manifestes ; style-src 'self' : pas de style en ligne (les styles posés par le code passent par le CSSOM, que cette ligne laisse passer). Le script d'API de Grist pose une feuille de style en ligne (variables --grist-theme-*) : la politique la refuse,
     sans effet ici, car GFS n'emploie que l'attribut data-grist-appearance que ce script pose aussi (à mesurer, rapport) ;
     img-src 'self' data: ; le reste est fermé. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval' https://docs.getgrist.com/grist-plugin-api.js 'sha256-zAthUDT/TLzF/ZWvHPqhKj1cRwzvjgpNpG4uMYk2D/U='; style-src 'self'; img-src 'self' data:; frame-src 'self' blob: https://www.youtube-nocookie.com https://player.vimeo.com; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">

<body data-gfs="starting">
<main class="stage" id="stage">
  <div class="frames" id="frames"></div>
  <!-- La barre de GFS au-dessus d'une app : « Fichiers », « Apps » et la position de la barre, trois boutons à icône seule (js/dock.js) posés au bord que la personne choisit
       (`data-edge`), par-dessus l'espace que l'app laisse libre ; l'app apprend ce qu'elle recouvre (contrats 5.2, point 7). -->
  <div class="floaters" id="floaters" role="group" data-edge="gauche" hidden>
    <button type="button" class="floater" id="floater-files"></button>
    <button type="button" class="floater" id="floater-apps" aria-haspopup="dialog"></button>
    <button type="button" class="floater" id="floater-work" aria-haspopup="dialog" aria-pressed="false"></button>
    <button type="button" class="floater" id="floater-place" aria-haspopup="menu"></button>
  </div>
  <p class="status" id="status" role="status" aria-live="polite" hidden></p>
  <p class="status toast" id="toast" role="status" aria-live="polite" hidden></p>
</main>
