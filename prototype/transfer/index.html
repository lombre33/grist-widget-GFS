<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cadre d'envoi de GFS</title>
<!-- Le cadre d'envoi de GFS (js/transfer.js) : isolé (sandbox sans allow-same-origin, origine opaque), il envoie et télécharge les pièces jointes de Grist pour GFS, qui lui donne chaque
     adresse avec son jeton. Politique de sécurité du contenu, ligne par ligne :
     script-src 'self' : son seul script, transfer.js, à côté de cette page ; le reste est fermé par default-src 'none' (pas de style, d'image, de cadre, de formulaire) ;
     connect-src https: : l'adresse du serveur Grist (docs.getgrist.com, l'instance d'une administration, un serveur privé) n'est connue qu'à l'exécution, c'est le baseUrl du jeton : aucune adresse
     ne peut être écrite ici. Ce que ce cadre peut atteindre se limite à ce que GFS lui demande, et la réponse ne va qu'à GFS. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src https:; base-uri 'none'; form-action 'none'">
</head>
<body>
<script src="transfer.js?v=11f54bb602"></script>
</body>
</html>
