<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sonde E</title>
<!-- Politique de l'app sonde E : script-src 'self' blob:. Comme Publipostage+ : pas de default-src, donc connect-src et style-src ouverts sauf mention. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
</head>
<body data-strategy="blob">
<p>Sonde E : script-src 'self' blob: (blob).</p>
<script src="../probe.js"></script>
</body>
</html>
