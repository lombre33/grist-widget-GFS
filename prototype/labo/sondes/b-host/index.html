<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sonde B</title>
<!-- Politique de l'app sonde B : script-src 'self' https://cdn.jsdelivr.net. Comme Publipostage+ : pas de default-src, donc connect-src et style-src ouverts sauf mention. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
</head>
<body data-strategy="script">
<p>Sonde B : script-src 'self' https://cdn.jsdelivr.net (script).</p>
<script src="../probe.js"></script>
</body>
</html>
