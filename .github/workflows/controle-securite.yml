# Le contrôle de sécurité des apps, chaque semaine (choix du porteur du 18/11, cahier 3.2.2 : « un contrôle automatique chaque semaine, en lecture seule sur les apps »).
# Il refait, depuis GitHub (dont les exécuteurs joignent les CDN, ce que le cloud de développement ne peut pas) :
#   - le relevé des versions et des avis des bibliothèques que GFS sert (prototype/outils/releve-dependances.mjs → bibliotheques/releve.json) ;
#   - le contrôle des apps (prototype/outils/controle-securite.mjs → bibliotheques/securite.json) : la politique de sécurité de la page de chaque app à la référence de GFS (sous-module),
#     les adresses de CDN écrites dans son code, son `GFS-ETAT.md`, Dependabot et `SECURITY.md`, les avis sur les bibliothèques qu'elle déclare, et l'empreinte que chaque CDN sert ce jour-là ;
#   - ce que GFS sert lui-même (même outil, partie `catalogue`, choix du porteur du 25/11) : chacune des adresses de CDN du catalogue relue chez le CDN et comparée à l'empreinte que GFS
#     garde, et la signature du registre npm de chaque paquet (le relevé ci-dessus la vérifie).
# Il ne pousse RIEN dans le dépôt d'une app ni chez grist-factory : seuls ces deux fichiers de GFS changent.
#   - Rien d'autre que la date n'a changé : un commit direct sur `main` (la fenêtre « Dépendances » affiche « Dernier contrôle : <date> »).
#   - Quelque chose a changé (un avis, une version, une politique, une empreinte) : une branche `controle-securite-AAAAMMJJ` qui porte le résultat, jamais un commit direct sur `main` et JAMAIS une
#     demande de fusion (choix du porteur, 25/11 : il n'a pas voulu donner à GitHub Actions le droit de créer et d'approuver des demandes de fusion ; le workflow n'a que `contents: write`).
#     Claude relit la branche et en fait un rapport dans le fil du porteur ; rien n'arrive sur `main` avant que le porteur ait validé (les corrections de sécurité se poussent à la main, après son accord).
# Aucune action tierce : seulement `actions/checkout` et `actions/setup-node`, comme `essais.yml`.
name: Contrôle de sécurité

on:
  schedule:
    - cron: '17 5 * * 1'   # le lundi, 5 h 17 UTC : une minute creuse, pour ne pas tomber sur l'heure ronde où GitHub est chargé
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: controle-securite
  cancel-in-progress: false

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Installer les dépendances d'essai (esbuild, grain-rpc, acorn)
        run: npm ci --ignore-scripts
        working-directory: prototype
      - name: Refaire le relevé des versions et des avis
        run: node outils/releve-dependances.mjs
        working-directory: prototype
      - name: Contrôler les apps et le catalogue (politiques, adresses, avis, empreintes des CDN)
        run: node outils/controle-securite.mjs --empreintes
        working-directory: prototype
      - name: Garder le résultat
        shell: bash
        run: |
          set -euo pipefail
          files="prototype/bibliotheques/securite.json prototype/bibliotheques/releve.json"
          if git diff --quiet -- $files; then echo "Aucun changement."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          today=$(date -u +%d/%m/%Y)
          # Les seules lignes qui changent sont-elles des dates ? (« controle », « releve », « empreintesLe », « lu », « origine »)
          substance=$(git diff -U0 -- $files | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -vcE '"(controle|releve|empreintesLe|lu|origine)":' || true)
          if [ "$substance" -eq 0 ]; then
            git add $files
            git commit -m "Contrôle de sécurité du $today : rien n'a changé (date seule)"
            git push origin HEAD:main
            exit 0
          fi
          branch="controle-securite-$(date -u +%Y%m%d)"
          git switch -c "$branch"
          git add $files
          git commit -m "Contrôle de sécurité du $today : quelque chose a changé"
          git push origin "$branch"
          # Pas de demande de fusion : la branche porte le résultat, Claude la relit et en fait le rapport au porteur, qui valide avant que quoi que ce soit n'arrive sur `main`.
          {
            echo "### Contrôle de sécurité du $today : quelque chose a changé"
            echo "Branche \`$branch\` (rien n'est sur \`main\`, rien n'a été poussé dans le dépôt d'une app). Le diff de \`prototype/bibliotheques/securite.json\` et de \`releve.json\` dit quoi."
          } >> "$GITHUB_STEP_SUMMARY"
