<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sonde P</title>
<!-- Politique de l'app sonde P : celle de Publipostage+ (script-src 'self', frame-src 'none', form-action 'none', pas de default-src). -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
</head>
<body data-reponse="oui">
<h1>Sonde P : une app qui reçoit le fichier d'un « Nouveau &gt; Importer » de GFS</h1>
<p>Ce que la sonde a reçu, fichier lu compris, est écrit dans <code>body[data-sonde]</code>, que le labo lit ; <code>body[data-reponse]</code> (<code>oui</code>, <code>non</code>) choisit sa réponse à l'appel <code>ouvrir</code>.</p>
<script src="importer.js"></script>
</body>
</html>
